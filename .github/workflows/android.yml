name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      # key.properties and the keystore are kept out of the repo, so CI
      # recreates them from repository secrets.
      - name: Write release keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p ~/keys
          echo "${KEYSTORE_BASE64}" | base64 -d > ~/keys/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=$HOME/keys/upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEYSTORE_ALIAS}
          keyPassword=${KEYSTORE_PASSWORD}
          EOF

      - name: Build signed AAB
        run: task build-android

      - name: Remove keystore
        if: always()
        run: rm -f ~/keys/upload-keystore.jks app/android/key.properties

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: didit-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
